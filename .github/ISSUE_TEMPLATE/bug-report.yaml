name: Bug report
description: "Report something in Aquila that behaves incorrectly."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please search the existing issues first, in case it is already reported.

        Do not use this form to report a security vulnerability. Follow the [Aquila security policy](https://github.com/vela-tools/aquila/security/policy) instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the incorrect behaviour, including the exact error message if there was one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Describe the correct behaviour. If it violates a specification, cite the clause.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: "The screen, what you clicked or entered, and the broker you used, with its product and version, such as Scorpio 6.0.1. If a subscription or entity is involved, include it as the broker returns it."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "The version shown next to Aquila in the header, or the image tag you run."
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Sample input or configuration
      description: A minimal sample that reproduces the problem. Remove any credentials, tokens, or private data first.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: "This is not a security vulnerability. Vulnerabilities are reported privately, following the [Aquila security policy](https://github.com/vela-tools/aquila/security/policy)."
          required: true
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I removed any credentials or private data from the report and samples above.
          required: true
