version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
    schedule:
      interval: "daily"
    rebase-strategy: "auto"
    labels: []
    # Titles such as "build(deps): bump ...", which the pull request title check accepts and the release
    # notes list under Dependencies.
    commit-message:
      prefix: "build"
      include: "scope"
    open-pull-requests-limit: 50
    # typescript-eslint accepts only typescript <6.1.0. Remove this entry once typescript-eslint supports
    # TypeScript 7.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker"
    directories:
      - "/"
    schedule:
      interval: "daily"
    rebase-strategy: "auto"
    labels: []
    commit-message:
      prefix: "build"
      include: "scope"
    open-pull-requests-limit: 50
    groups:
      docker-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker-compose"
    directories:
      - "/docker"
    schedule:
      interval: "daily"
    rebase-strategy: "auto"
    labels: []
    commit-message:
      prefix: "build"
      include: "scope"
    open-pull-requests-limit: 50
    # Scorpio java-6.0.2 is published but not released, and it does not work with this stack. Remove this
    # entry once 6.0.2 or a later version is released.
    ignore:
      - dependency-name: "scorpiobroker/all-in-one-runner"
    groups:
      docker-compose-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "daily"
    rebase-strategy: "auto"
    labels: []
    commit-message:
      prefix: "build"
      include: "scope"
    open-pull-requests-limit: 50
    groups:
      github-actions-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
